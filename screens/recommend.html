<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phoU · AI 추천</title>
<style>
  /* ---------- 디자인 토큰 (home.html과 같은 값) ---------- */
  :root {
    --bg: #FFFFFF;
    --text: #111111;
    --sub: #6B6B6B;
    --surface: #F3F3F3;
    --line: #DADADA;
    --thumb: #E4E4E4;
    --page: #E9E9E9;
    --on-dark: #FFFFFF;

    /* 사진 자리 회색 3단계 (album.html과 같은 값) */
    --ph-1: #E4E4E4;
    --ph-2: #D6D6D6;
    --ph-3: #C9C9C9;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 20px;
    --s-6: 24px;
    --s-8: 32px;

    --r-card: 20px;
    --r-photo: 24px;
    --r-pill: 999px;
    --border: 1.5px solid var(--line);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--page);
    color: var(--text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button, a { font: inherit; color: inherit; }
  button { background: none; border: none; cursor: pointer; }
  a { text-decoration: none; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- 폰 프레임 ---------- */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 48px;
    box-shadow: 0 0 0 10px var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    padding: 0 var(--s-8) var(--s-2);
    font-size: 15px;
    font-weight: 600;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: var(--s-2) 0 var(--s-6);
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }
  .pad { padding: 0 var(--s-5); }

  .top { height: 44px; display: flex; align-items: center; }
  .icon-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-pill);
  }
  .top .back { margin-left: calc(var(--s-3) * -1); }

  .intro { margin: var(--s-3) 0 var(--s-5); }
  .intro .eyebrow { color: var(--sub); margin-bottom: var(--s-2); }
  .intro h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

  /* ---------- 추천 카드 (옆으로 넘기기) ---------- */
  .carousel {
    display: flex;
    gap: var(--s-3);
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 0 var(--s-5);
    scroll-padding: 0 var(--s-5);
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 82%;
    scroll-snap-align: start;
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: var(--r-photo);
    display: flex; align-items: center; justify-content: center;
    color: var(--sub);
  }
  .tone-1 { background: var(--ph-1); }
  .tone-2 { background: var(--ph-2); }
  .tone-3 { background: var(--ph-3); }
  .reason {
    position: absolute;
    top: var(--s-4); left: var(--s-4);
    display: flex; align-items: center; gap: var(--s-1);
    background: var(--bg);
    padding: var(--s-1) var(--s-3);
    border-radius: var(--r-pill);
    font-weight: 700;
  }
  .burst {
    position: absolute;
    left: var(--s-4); bottom: var(--s-4);
    background: var(--bg);
    color: var(--sub);
    padding: var(--s-1) var(--s-3);
    border-radius: var(--r-pill);
  }
  .save {
    position: absolute;
    right: var(--s-4); bottom: var(--s-4);
    height: 48px;
    min-width: 48px;
    padding: 0 var(--s-3);
    border-radius: var(--r-pill);
    background: var(--text);
    color: var(--on-dark);
    display: flex; align-items: center; justify-content: center; gap: var(--s-1);
    font-weight: 700;
  }
  .save[aria-pressed="true"] { background: var(--bg); color: var(--text); }

  /* 마지막 카드: 다 봤어요 */
  .slide.end {
    background: var(--surface);
    border: var(--border);
    flex-direction: column;
    gap: var(--s-2);
    text-align: center;
    padding: var(--s-6);
    color: var(--text);
  }
  .slide.end .title { font-size: 20px; font-weight: 800; }
  .slide.end .desc { color: var(--sub); }

  .pager {
    display: flex; align-items: center; justify-content: center; gap: var(--s-4);
    margin-top: var(--s-3);
  }
  .pager .count { font-weight: 600; min-width: 72px; text-align: center; }
  .pager .icon-btn { border: var(--border); }
  .pager .icon-btn:disabled { color: var(--line); cursor: default; }
  .saved-note { text-align: center; color: var(--sub); margin-top: var(--s-1); }

  /* ---------- 아래 기능 목록 ---------- */
  .tools { margin-top: var(--s-6); display: flex; flex-direction: column; gap: var(--s-2); }
  .tool {
    width: 100%;
    display: flex; align-items: center; gap: var(--s-3);
    text-align: left;
    background: var(--surface);
    border: var(--border);
    border-radius: var(--r-card);
    padding: var(--s-4);
  }
  .tool .ico {
    width: 44px; height: 44px; flex-shrink: 0;
    border-radius: var(--r-pill);
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .tool .text { flex: 1; }
  .tool .title { display: block; font-weight: 700; }
  .tool .desc { display: block; color: var(--sub); margin-top: 2px; }

  /* 로딩 / 빈 상태 */
  .state {
    margin: var(--s-6) var(--s-5) 0;
    background: var(--surface);
    border: var(--border);
    border-radius: var(--r-card);
    padding: var(--s-8) var(--s-6);
    display: flex; flex-direction: column; align-items: center; gap: var(--s-2);
    text-align: center;
  }
  .state .title { font-size: 18px; font-weight: 700; }
  .state .desc { color: var(--sub); }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--line);
    border-top-color: var(--text);
    border-radius: var(--r-pill);
    animation: spin 0.8s linear infinite;
    margin-bottom: var(--s-2);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-primary {
    height: 52px;
    padding: 0 var(--s-6);
    margin-top: var(--s-3);
    border-radius: var(--r-pill);
    background: var(--text);
    color: var(--on-dark);
    font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ---------- 하단 탭바 (home.html과 같음) ---------- */
  .tabbar {
    flex-shrink: 0;
    margin: 0 var(--s-4);
    height: 64px;
    border: var(--border);
    border-radius: var(--r-pill);
    background: var(--bg);
    display: flex; align-items: center;
    padding: 0 var(--s-2);
  }
  .tab {
    flex: 1;
    height: 48px;
    border-radius: var(--r-pill);
    display: flex; align-items: center; justify-content: center; gap: var(--s-2);
    color: var(--sub);
    font-weight: 600;
  }
  .tab[aria-current="page"] { background: var(--surface); color: var(--text); }
  .tab-add { flex: 0 0 auto; margin: 0 var(--s-2); width: 48px; height: 48px; }
  .tab-add .circle {
    width: 48px; height: 48px;
    border-radius: var(--r-pill);
    background: var(--text);
    color: var(--on-dark);
    display: flex; align-items: center; justify-content: center;
  }
  .home-indicator {
    width: 134px; height: 5px;
    background: var(--text);
    border-radius: var(--r-pill);
    margin: var(--s-3) auto var(--s-2);
    flex-shrink: 0;
  }

  .toast {
    position: absolute;
    left: 50%;
    bottom: 104px;
    transform: translate(-50%, 8px);
    background: var(--text);
    color: var(--on-dark);
    padding: var(--s-3) var(--s-5);
    border-radius: var(--r-pill);
    width: max-content;
    max-width: calc(100% - var(--s-8) * 2);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 430px) {
    body { display: block; background: var(--bg); }
    .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar" aria-hidden="true">9:41</div>

  <main class="screen">
    <div class="pad">
      <div class="top">
        <a class="icon-btn back" id="backBtn" href="home.html" aria-label="앨범으로 돌아가기">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
      </div>
      <section class="intro">
        <p class="eyebrow" id="eyebrow"></p>
        <h1>이 사진 어때요?</h1>
      </section>
    </div>

    <div id="content"></div>
  </main>

  <nav class="tabbar" aria-label="하단 메뉴">
    <a class="tab" href="home.html" aria-current="page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      앨범
    </a>
    <a class="tab tab-add" href="create.html">
      <span class="circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span class="sr-only">새 앨범 만들기</span>
    </a>
    <button class="tab" onclick="showToast('준비 중인 기능이에요')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      내 정보
    </button>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
  // ---- 화면끼리 함께 쓰는 저장소 ----
  const Store = {
    get() { try { return JSON.parse(localStorage.getItem('phou.albums')) || []; } catch (e) { return []; } },
  };

  // ---- 더미 앨범과 사진 (album.html과 같은 값·같은 규칙) ----
  const DUMMY_ALBUMS = [
    { id: 1, name: '다같이 홍대 투어', date: '2026.10.09', members: 5, photoCount: 36 },
    { id: 2, name: '속초 여행',       date: '2026.09.20', members: 4, photoCount: 30 },
    { id: 3, name: '롯데 팬들 직관',   date: '2026.08.30', members: 6, photoCount: 24 },
    { id: 4, name: '고양이 전시회',    date: '2026.08.12', members: 3, photoCount: 18 },
  ];
  function makePhotos(album) {
    const people = ['나', 'A', 'B', 'C', 'D', 'E'].slice(0, Math.max(2, album.members));
    let s = album.id * 9301 + 49297;
    const rand = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const photos = [];
    let group = 0;
    while (photos.length < (album.photoCount || 0)) {
      group++;
      const burst = rand() < 0.45 ? 2 + Math.floor(rand() * 3) : 1;
      const by = people[Math.floor(rand() * people.length)];
      const hasMe = by !== '나' && rand() < 0.4;
      const hour = 13 + Math.floor(photos.length / 8);
      for (let i = 0; i < burst && photos.length < album.photoCount; i++) {
        const n = photos.length;
        photos.push({ id: n + 1, group, by, hasMe, tone: 1 + (group % 3), time: `${hour}:${String((n * 7) % 60).padStart(2, '0')}` });
      }
    }
    return photos;
  }

  // AI 추천 = 비슷한 사진 묶음마다 가장 잘 나온 1장 + 고른 이유 (더미)
  const REASONS = ['얼굴 선명함', '모두 눈 뜸', '흔들림 없음', '표정 좋음', '구도 안정적'];
  function makePicks(photos) {
    const groups = new Map();
    photos.forEach(p => { if (!groups.has(p.group)) groups.set(p.group, []); groups.get(p.group).push(p); });
    return [...groups.values()].map(list => ({
      photo: list[0],
      burst: list.length,
      reason: REASONS[list[0].group % REASONS.length],
    }));
  }

  const id = Number(new URLSearchParams(location.search).get('id'));
  const album = [...Store.get(), ...DUMMY_ALBUMS].find(a => a.id === id);
  const content = document.getElementById('content');
  let picks = [];
  const saved = new Set();
  let index = 0;

  const photoIcon = `
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>
    </svg>`;
  const downIcon = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>`;
  const checkIcon = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const sparkIcon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.6L19.5 9l-5.7 1.6L12 16l-1.8-5.4L4.5 9l5.7-1.4L12 2Z"/></svg>`;

  // ---------- 상태별 화면 ----------
  function renderLoading() {
    content.innerHTML = `
      <div class="state" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p class="title">AI가 사진을 고르는 중이에요</p>
        <p class="desc">가장 잘 나온 컷을 찾고 있어요</p>
      </div>`;
  }

  function renderEmpty(title, desc) {
    content.innerHTML = `
      <div class="state">
        <p class="title">${title}</p>
        <p class="desc">${desc}</p>
        <a class="btn-primary" href="${album ? 'album.html?id=' + album.id : 'home.html'}">${album ? '앨범으로 돌아가기' : '홈으로'}</a>
      </div>`;
  }

  function renderMain() {
    content.innerHTML = `
      <div class="carousel" id="carousel" tabindex="0" aria-roledescription="carousel" aria-label="AI 추천 사진">
        ${picks.map((k, i) => `
          <div class="slide tone-${k.photo.tone}" role="group" aria-roledescription="slide" aria-label="추천 ${i + 1} / ${picks.length}, ${k.reason}">
            ${photoIcon}
            <span class="reason">${sparkIcon}${k.reason}</span>
            ${k.burst > 1 ? `<span class="burst">비슷한 사진 ${k.burst}장 중</span>` : ''}
            <button class="save" data-i="${i}" aria-pressed="false" aria-label="이 사진 저장">${downIcon}</button>
          </div>`).join('')}
        <div class="slide end" role="group" aria-label="추천 끝">
          <p class="title">추천을 다 봤어요</p>
          <p class="desc" id="endDesc"></p>
          <a class="btn-primary" href="album.html?id=${album.id}">앨범 전체 보기</a>
        </div>
      </div>
      <div class="pager">
        <button class="icon-btn" id="prevBtn" aria-label="이전 추천">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span class="count" id="count" aria-live="polite"></span>
        <button class="icon-btn" id="nextBtn" aria-label="다음 추천">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <p class="saved-note" id="savedNote" aria-live="polite"></p>

      <div class="pad">
        <div class="tools">
          <button class="tool" data-tool="AI 필터는">
            <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
            <span class="text"><span class="title">AI 필터</span><span class="desc">흐린 날을 맑게, 노을 지는 하늘로</span></span>
          </button>
          <button class="tool" data-tool="비슷한 사진 정리는">
            <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg></span>
            <span class="text"><span class="title">비슷한 사진 정리</span><span class="desc">겹치는 컷 중 베스트만 남기기</span></span>
          </button>
          <button class="tool" data-tool="장소별 사진은">
            <span class="ico" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
            <span class="text"><span class="title">장소별 사진</span><span class="desc">찍은 위치로 모아 보기</span></span>
          </button>
        </div>
      </div>`;

    const carousel = document.getElementById('carousel');
    const slides = [...carousel.children];

    // 넘긴 위치를 보고 지금 몇 번째인지 계산
    carousel.addEventListener('scroll', () => {
      const w = slides[0].getBoundingClientRect().width + parseFloat(getComputedStyle(carousel).columnGap);
      const i = Math.round(carousel.scrollLeft / w);
      if (i !== index) { index = i; updatePager(); }
    }, { passive: true });

    document.getElementById('prevBtn').addEventListener('click', () => goTo(index - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(index + 1));
    carousel.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); goTo(index + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(index - 1); }
    });

    carousel.querySelectorAll('.save').forEach(b => b.addEventListener('click', () => toggleSave(b)));
    content.querySelectorAll('.tool').forEach(t => t.addEventListener('click', () => showToast(`${t.dataset.tool} 다음 단계에서 만들어요`)));

    updatePager();
  }

  function goTo(i) {
    const carousel = document.getElementById('carousel');
    const slides = [...carousel.children];
    if (i < 0 || i >= slides.length) return;
    index = i;
    const w = slides[0].getBoundingClientRect().width + parseFloat(getComputedStyle(carousel).columnGap);
    carousel.scrollTo({ left: i * w, behavior: 'smooth' });
    updatePager();
  }

  function updatePager() {
    const total = picks.length;
    const atEnd = index >= total;
    document.getElementById('count').textContent = atEnd ? '끝' : `${index + 1} / ${total}`;
    document.getElementById('prevBtn').disabled = index === 0;
    document.getElementById('nextBtn').disabled = atEnd;
    document.getElementById('savedNote').textContent = saved.size ? `${saved.size}장 저장함` : '';
    document.getElementById('endDesc').textContent = saved.size
      ? `베스트 ${total}장 중 ${saved.size}장을 내 폰에 저장했어요`
      : `베스트 ${total}장을 모두 봤어요`;
  }

  // 저장 ↔ 저장 취소 (두 번 눌러도 상태만 바뀌고 중복 저장 없음)
  function toggleSave(btn) {
    const i = Number(btn.dataset.i);
    const on = !saved.has(i);
    on ? saved.add(i) : saved.delete(i);
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? '저장됨, 누르면 취소' : '이 사진 저장');
    btn.innerHTML = on ? `${checkIcon}저장됨` : downIcon;
    showToast(on ? '내 폰에 저장했어요' : '저장을 취소했어요');
    updatePager();
  }

  function load() {
    if (!album) {
      document.getElementById('eyebrow').textContent = '';
      return renderEmpty('앨범을 찾을 수 없어요', '홈에서 앨범을 다시 골라 주세요');
    }
    document.getElementById('backBtn').href = 'album.html?id=' + album.id;
    document.getElementById('eyebrow').textContent = `'${album.name}' AI 추천`;
    picks = makePicks(makePhotos(album));
    renderLoading();
    setTimeout(() => {
      if (picks.length === 0) return renderEmpty('추천할 사진이 아직 없어요', '친구들이 사진을 올리면 AI가 골라 드릴게요');
      renderMain();
    }, 900);
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  load();
</script>
</body>
</html>
