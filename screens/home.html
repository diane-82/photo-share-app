<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phoU · 홈</title>
<style>
  /* ---------- 디자인 토큰 (색·간격은 여기서만 바꾼다) ---------- */
  :root {
    --bg: #FFFFFF;
    --text: #111111;
    --sub: #6B6B6B;
    --surface: #F3F3F3;
    --line: #DADADA;
    --thumb: #E4E4E4;
    --page: #E9E9E9;
    --on-dark: #FFFFFF;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 20px;
    --s-6: 24px;
    --s-8: 32px;

    --r-card: 20px;
    --r-thumb: 14px;
    --r-pill: 999px;
    --border: 1.5px solid var(--line);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--page);
    color: var(--text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- 폰 프레임 ---------- */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 48px;
    box-shadow: 0 0 0 10px var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    padding: 0 var(--s-8) var(--s-2);
    font-size: 15px;
    font-weight: 600;
  }

  /* ---------- 스크롤 영역 ---------- */
  .screen {
    flex: 1;
    overflow-y: auto;
    padding: var(--s-2) var(--s-5) var(--s-6);
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 44px;
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .icon-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r-pill);
  }

  .intro { margin: var(--s-6) 0 var(--s-8); }
  .intro .eyebrow { color: var(--sub); margin-bottom: var(--s-2); }
  .intro h1 { font-size: 28px; font-weight: 800; line-height: 1.35; letter-spacing: -0.5px; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: var(--s-2);
    margin-bottom: var(--s-3);
  }
  .section-head h2 { font-size: 18px; font-weight: 700; }
  .section-head span { color: var(--sub); }

  /* ---------- 앨범 카드 ---------- */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--s-3);
  }
  .album {
    position: relative;
    text-align: left;
    background: var(--surface);
    border: var(--border);
    border-radius: var(--r-card);
    padding: var(--s-2) var(--s-2) var(--s-3);
    display: flex;
    flex-direction: column;
    gap: var(--s-2);
  }
  .album:active { transform: scale(0.98); }
  .thumb {
    aspect-ratio: 1 / 1;
    background: var(--thumb);
    border-radius: var(--r-thumb);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sub);
  }
  .album .name {
    font-weight: 700;
    padding: 0 var(--s-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .album .meta { color: var(--sub); padding: 0 var(--s-1); }
  .badge-new {
    position: absolute;
    top: var(--s-4); left: var(--s-4);
    background: var(--text);
    color: var(--on-dark);
    font-size: 14px;
    font-weight: 700;
    padding: 2px var(--s-2);
    border-radius: var(--r-pill);
  }

  /* 로딩: 회색 빈 카드가 천천히 깜빡임 */
  .skeleton {
    background: var(--surface);
    border: var(--border);
    border-radius: var(--r-card);
    aspect-ratio: 3 / 4;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.5; } }

  /* 빈 상태 */
  .empty {
    background: var(--surface);
    border: var(--border);
    border-radius: var(--r-card);
    padding: var(--s-8) var(--s-6);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--s-2);
  }
  .empty .title { font-size: 18px; font-weight: 700; }
  .empty .desc { color: var(--sub); }
  .btn-primary {
    margin-top: var(--s-3);
    background: var(--text);
    color: var(--on-dark);
    font-weight: 600;
    padding: var(--s-3) var(--s-6);
    border-radius: var(--r-pill);
  }

  /* ---------- 하단 탭바 ---------- */
  .tabbar {
    flex-shrink: 0;
    margin: 0 var(--s-4);
    height: 64px;
    border: var(--border);
    border-radius: var(--r-pill);
    background: var(--bg);
    display: flex;
    align-items: center;
    padding: 0 var(--s-2);
  }
  .tab {
    flex: 1;
    height: 48px;
    border-radius: var(--r-pill);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--s-2);
    color: var(--sub);
    font-weight: 600;
  }
  .tab[aria-current="page"] { background: var(--surface); color: var(--text); }
  .tab-add { flex: 0 0 auto; margin: 0 var(--s-2); width: 48px; height: 48px; }
  .tab-add .circle {
    width: 48px; height: 48px;
    border-radius: var(--r-pill);
    background: var(--text);
    color: var(--on-dark);
    display: flex; align-items: center; justify-content: center;
  }
  .home-indicator {
    width: 134px; height: 5px;
    background: var(--text);
    border-radius: var(--r-pill);
    margin: var(--s-3) auto var(--s-2);
    flex-shrink: 0;
  }

  /* ---------- 안내 토스트 ---------- */
  .toast {
    position: absolute;
    left: 50%;
    bottom: 104px;
    transform: translate(-50%, 8px);
    background: var(--text);
    color: var(--on-dark);
    padding: var(--s-3) var(--s-5);
    border-radius: var(--r-pill);
    width: max-content;
    max-width: calc(100% - var(--s-8) * 2);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 실제 폰 폭에서는 프레임 없이 꽉 차게 ---------- */
  @media (max-width: 430px) {
    body { display: block; background: var(--bg); }
    .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar" aria-hidden="true">9:41</div>

  <main class="screen">
    <div class="top">
      <span class="logo">phoU</span>
      <button class="icon-btn" aria-label="알림" onclick="showToast('준비 중인 기능이에요')">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
        </svg>
      </button>
    </div>

    <section class="intro">
      <p class="eyebrow">이번 주말에 찍은 사진 36장이 그대로 있어요</p>
      <h1>친구와 사진을<br>공유해볼까요?</h1>
    </section>

    <section aria-labelledby="albumsTitle">
      <div class="section-head">
        <h2 id="albumsTitle">내 앨범</h2>
        <span id="albumCount"></span>
      </div>
      <div id="albumArea"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="하단 메뉴">
    <button class="tab" aria-current="page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      앨범
    </button>
    <button class="tab tab-add" onclick="goCreate()">
      <span class="circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </span>
      <span class="sr-only">새 앨범 만들기</span>
    </button>
    <button class="tab" onclick="showToast('준비 중인 기능이에요')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      내 정보
    </button>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
  // ---- 더미 데이터 (실제 사람 이름 없음) ----
  const ALBUMS = [
    { id: 1, name: '다같이 홍대 투어', date: '2026.10.09', members: 5 },
    { id: 2, name: '속초 여행',       date: '2026.09.20', members: 4 },
    { id: 3, name: '롯데 팬들 직관',   date: '2026.08.30', members: 6 },
    { id: 4, name: '고양이 전시회',    date: '2026.08.12', members: 3 },
  ];
  const NEW_ALBUM = { id: 5, name: '성수 나들이', date: '2026.10.10', members: 1, isNew: true };

  // ---- 화면끼리 함께 쓰는 저장소 (create.html에서 만든 앨범) ----
  const Store = {
    get() { try { return JSON.parse(localStorage.getItem('phou.albums')) || []; } catch (e) { return []; } },
  };

  // 상태 확인용: home.html?state=empty (앨범 0개) / home.html?state=done (새 앨범 추가 직후)
  const state = new URLSearchParams(location.search).get('state');

  const area = document.getElementById('albumArea');
  const countEl = document.getElementById('albumCount');

  const photoIcon = `
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>
    </svg>`;

  function renderLoading() {
    countEl.textContent = '';
    area.innerHTML = `<div class="grid" aria-busy="true" aria-label="앨범 불러오는 중">
      ${'<div class="skeleton"></div>'.repeat(4)}
    </div>`;
  }

  function renderEmpty() {
    countEl.textContent = '0개';
    area.innerHTML = `
      <div class="empty">
        <p class="title">아직 공유 앨범이 없어요</p>
        <p class="desc">첫 앨범을 만들고 친구를 초대해 보세요</p>
        <button class="btn-primary" onclick="goCreate()">새 앨범 만들기</button>
      </div>`;
  }

  // 더미 앨범은 date, 새로 만든 앨범은 start(2026-10-10)를 가지고 있어 한 형식으로 맞춤
  const dateOf = a => a.date || a.start.replaceAll('-', '.');

  function renderAlbums(list) {
    countEl.textContent = `${list.length}개`;
    area.innerHTML = `<div class="grid">${list.map(a => `
      <button class="album" onclick="openAlbum(${a.id})" aria-label="${a.name}, ${dateOf(a)}, ${a.members}명${a.isNew ? ', 새 앨범' : ''}">
        <div class="thumb">${photoIcon}</div>
        ${a.isNew ? '<span class="badge-new">NEW</span>' : ''}
        <span class="name">${a.name}</span>
        <span class="meta">${dateOf(a)} · ${a.members}명</span>
      </button>`).join('')}
    </div>`;
  }

  function load() {
    renderLoading();
    setTimeout(() => {
      if (state === 'empty') return renderEmpty();
      if (state === 'done') {
        renderAlbums([NEW_ALBUM, ...ALBUMS]);
        showToast('새 앨범을 만들었어요');
        return;
      }
      renderAlbums([...Store.get(), ...ALBUMS]);
      let justCreated = null;
      try { justCreated = sessionStorage.getItem('phou.justCreated'); sessionStorage.removeItem('phou.justCreated'); } catch (e) {}
      if (justCreated) showToast('새 앨범을 만들었어요');
    }, 700);
  }

  // ---- 다음 단계에서 연결할 화면들: 지금은 안내만 ----
  function openAlbum(id) {
    const a = [NEW_ALBUM, ...Store.get(), ...ALBUMS].find(x => x.id === id);
    showToast(`'${a.name}' 앨범 보기는 다음 단계에서 연결돼요`);
  }
  function goCreate() {
    location.href = 'create.html';
  }

  // 같은 버튼을 빠르게 여러 번 눌러도 토스트는 하나만, 시간만 다시 셈
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  load();
</script>
</body>
</html>
