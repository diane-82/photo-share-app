<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phoU · 앨범 초대</title>
<style>
  /* ---------- 디자인 토큰 (home.html과 같은 값) ---------- */
  :root {
    --bg: #FFFFFF;
    --text: #111111;
    --sub: #6B6B6B;
    --surface: #F3F3F3;
    --line: #DADADA;
    --thumb: #E4E4E4;
    --page: #E9E9E9;
    --on-dark: #FFFFFF;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 20px;
    --s-6: 24px;
    --s-8: 32px;

    --r-card: 20px;
    --r-pill: 999px;
    --border: 1.5px solid var(--line);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--page);
    color: var(--text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button, a { font: inherit; color: inherit; }
  button { background: none; border: none; cursor: pointer; }
  a { text-decoration: none; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- 폰 프레임 ---------- */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 48px;
    box-shadow: 0 0 0 10px var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 48px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    padding: 0 var(--s-8) var(--s-2);
    font-size: 15px;
    font-weight: 600;
  }

  /* 웹으로 열린 화면이라는 표시: 주소창 */
  .address {
    flex-shrink: 0;
    margin: var(--s-1) var(--s-4) 0;
    height: 40px;
    border-radius: var(--r-pill);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center; gap: var(--s-2);
    color: var(--sub);
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: var(--s-5) var(--s-5) var(--s-6);
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

  .intro { margin: var(--s-6) 0 var(--s-5); }
  .intro .eyebrow { color: var(--sub); margin-bottom: var(--s-2); }
  .intro h1 { font-size: 28px; font-weight: 800; line-height: 1.35; letter-spacing: -0.5px; word-break: keep-all; }

  .host { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-5); }
  .avatar {
    width: 36px; height: 36px; flex-shrink: 0;
    border-radius: var(--r-pill);
    background: var(--text);
    color: var(--on-dark);
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .host b { font-weight: 700; }

  /* 앨범 정보 */
  .info {
    background: var(--surface);
    border: var(--border);
    border-radius: var(--r-card);
    padding: var(--s-2) var(--s-4);
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 52px;
    gap: var(--s-3);
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row .label { color: var(--sub); }
  .row .value { font-weight: 600; display: flex; align-items: center; gap: var(--s-2); }
  .faces { display: flex; }
  .faces span {
    width: 28px; height: 28px;
    margin-left: -8px;
    border-radius: var(--r-pill);
    background: var(--bg);
    border: 1.5px solid var(--line);
    font-size: 16px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .faces span:first-child { margin-left: 0; }

  .notes { margin-top: var(--s-4); display: flex; flex-direction: column; gap: var(--s-2); }
  .note { display: flex; align-items: flex-start; gap: var(--s-2); color: var(--sub); }
  .note svg { flex-shrink: 0; margin-top: 2px; }

  /* 로딩 */
  .loading {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-3);
    color: var(--sub);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--line);
    border-top-color: var(--text);
    border-radius: var(--r-pill);
    animation: spin 0.8s linear infinite;
  }
  .spinner.small { width: 18px; height: 18px; border-width: 2px; border-color: var(--sub); border-top-color: var(--on-dark); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 만료 · 그만두기 안내 */
  .message {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: var(--s-2);
    padding: 0 var(--s-4);
  }
  .message .icon {
    width: 64px; height: 64px;
    border-radius: var(--r-pill);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: var(--s-2);
  }
  .message .title { font-size: 20px; font-weight: 700; }
  .message .desc { color: var(--sub); word-break: keep-all; }

  /* ---------- 하단 버튼 ---------- */
  .bottom {
    flex-shrink: 0;
    display: flex; gap: var(--s-2);
    padding: var(--s-3) var(--s-5) 0;
    border-top: 1px solid var(--surface);
  }
  .btn-primary {
    flex: 2;
    height: 56px;
    border-radius: var(--r-pill);
    background: var(--text);
    color: var(--on-dark);
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: var(--s-2);
  }
  .btn-secondary {
    flex: 1;
    height: 56px;
    border-radius: var(--r-pill);
    border: var(--border);
    font-weight: 700;
  }
  .message .btn-secondary { flex: none; padding: 0 var(--s-6); margin-top: var(--s-4); }

  .home-indicator {
    width: 134px; height: 5px;
    background: var(--text);
    border-radius: var(--r-pill);
    margin: var(--s-3) auto var(--s-2);
    flex-shrink: 0;
  }

  @media (max-width: 430px) {
    body { display: block; background: var(--bg); }
    .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar" aria-hidden="true">9:41</div>
  <div class="address" aria-label="웹 주소">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span id="addressText">phou.app</span>
  </div>

  <main class="screen" id="screen">
    <div class="loading" id="loadingView" role="status">
      <div class="spinner" aria-hidden="true"></div>
      초대장을 여는 중…
    </div>

    <div id="mainView" hidden>
      <p class="logo">phoU</p>

      <section class="intro">
        <p class="eyebrow" id="dateText"></p>
        <h1 id="title"></h1>
      </section>

      <div class="host">
        <span class="avatar" aria-hidden="true">A</span>
        <p><b>A</b>님이 초대했어요</p>
      </div>

      <div class="info">
        <div class="row"><span class="label">기간</span><span class="value" id="period"></span></div>
        <div class="row"><span class="label">멤버</span><span class="value"><span class="faces" id="faces" aria-hidden="true"></span><span id="memberCount"></span></span></div>
        <div class="row"><span class="label">사진</span><span class="value" id="photoCount"></span></div>
      </div>

      <div class="notes">
        <p class="note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span id="expireText"></span>
        </p>
        <p class="note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          앱 설치나 가입 없이 바로 볼 수 있어요
        </p>
      </div>
    </div>

    <!-- 만료된 링크 -->
    <div class="message" id="expiredView" hidden>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2M4 4l16 16"/></svg>
      </div>
      <p class="title" id="expiredTitle">링크가 만료됐어요</p>
      <p class="desc">초대한 친구에게 새 링크를 요청해 주세요</p>
    </div>

    <!-- 그만두기 후 -->
    <div class="message" id="declinedView" hidden>
      <div class="icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>
      <p class="title">참여하지 않았어요</p>
      <p class="desc" id="declinedDesc"></p>
      <button class="btn-secondary" id="undoBtn">초대장 다시 보기</button>
    </div>
  </main>

  <div class="bottom" id="bottomBar" hidden>
    <button class="btn-secondary" id="declineBtn">그만두기</button>
    <button class="btn-primary" id="joinBtn">참여하기</button>
  </div>
  <div class="home-indicator" aria-hidden="true"></div>
</div>

<script>
  // ---- 화면끼리 함께 쓰는 저장소 ----
  const Store = {
    get() { try { return JSON.parse(localStorage.getItem('phou.albums')) || []; } catch (e) { return []; } },
  };

  // ---- 더미 앨범 (album.html과 같은 값) ----
  const DUMMY_ALBUMS = [
    { id: 1, name: '다같이 홍대 투어', date: '2026.10.09', members: 5, photoCount: 36 },
    { id: 2, name: '속초 여행',       date: '2026.09.20', members: 4, photoCount: 30 },
    { id: 3, name: '롯데 팬들 직관',   date: '2026.08.30', members: 6, photoCount: 24 },
    { id: 4, name: '고양이 전시회',    date: '2026.08.12', members: 3, photoCount: 18 },
  ];

  // 확인용: join.html?expired=1 → 만료된 링크 상태
  const params = new URLSearchParams(location.search);
  const id = Number(params.get('id') || 1);
  const expired = params.get('expired') === '1';
  const album = [...Store.get(), ...DUMMY_ALBUMS].find(a => a.id === id);

  const $ = s => document.getElementById(s);
  const fmt = d => `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  let joining = false;

  function show(view) {
    ['loadingView', 'mainView', 'expiredView', 'declinedView'].forEach(v => $(v).hidden = v !== view);
    $('bottomBar').hidden = view !== 'mainView';
  }

  function fill() {
    const start = album.start ? album.start.replaceAll('-', '.') : album.date;
    const end = album.end ? album.end.replaceAll('-', '.') : album.date;
    const until = new Date();
    until.setDate(until.getDate() + (album.expireDays || 7));

    $('addressText').textContent = `phou.app/a/${album.id.toString(36)}`;
    $('dateText').textContent = start;
    $('title').textContent = `'${album.name}'에 참여할까요?`;
    $('period').textContent = start === end ? start : `${start} ~ ${end}`;
    $('faces').innerHTML = ['A', 'B', 'C', 'D'].slice(0, Math.min(album.members, 4)).map(i => `<span>${i}</span>`).join('');
    $('memberCount').textContent = `${album.members}명`;
    $('photoCount').textContent = `${album.photoCount || 0}장`;
    $('expireText').textContent = `${fmt(until)}까지 열 수 있어요`;
    $('declinedDesc').textContent = `${fmt(until)}까지는 다시 참여할 수 있어요`;
  }

  // 상태: 로딩 → 기본 / 만료 / (앨범 없음도 만료와 같은 안내)
  setTimeout(() => {
    if (expired || !album) {
      if (!album) $('expiredTitle').textContent = '초대 링크를 찾을 수 없어요';
      return show('expiredView');
    }
    fill();
    show('mainView');
  }, 600);

  $('declineBtn').addEventListener('click', () => { show('declinedView'); $('undoBtn').focus(); });
  $('undoBtn').addEventListener('click', () => { show('mainView'); $('joinBtn').focus(); });

  $('joinBtn').addEventListener('click', () => {
    if (joining) return;  // 연타 방지
    joining = true;
    $('joinBtn').disabled = true;
    $('declineBtn').disabled = true;
    $('joinBtn').innerHTML = '<span class="spinner small" aria-hidden="true"></span>참여하는 중…';
    setTimeout(() => {
      try { sessionStorage.setItem('phou.joined', String(album.id)); } catch (e) {}
      location.href = 'album.html?id=' + album.id;
    }, 800);
  });

  // 뒤로가기로 돌아오면 버튼 다시 쓸 수 있게
  window.addEventListener('pageshow', e => {
    if (!e.persisted) return;
    joining = false;
    $('joinBtn').disabled = false;
    $('declineBtn').disabled = false;
    $('joinBtn').textContent = '참여하기';
  });
</script>
</body>
</html>
